name: Android App bauen

# Baut die Schwalmtalzupfer-App (mobile-app/) als signierte Release-APK und legt sie
# als GitHub Release ab. Läuft bei jedem Push auf main mit Änderungen in mobile-app/,
# oder manuell über "Run workflow".
#
# Für eine echt signierte (Play-Store-taugliche) APK müssen folgende Repo-Secrets
# gesetzt sein (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   – `base64 -w0 upload-keystore.jks` (bzw. certutil auf Windows)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Fehlen diese, baut der Workflow trotzdem durch, signiert aber nur mit dem
# Debug-Key (kein GitHub Release, nur der Artifact-Download) – siehe
# plugins/withAndroidReleaseSigning.js.
#
# Zusätzlich für den In-App-Update-Hinweis (vor dem Play-Store-Release) wird die
# signierte APK ans eigene Backend gemeldet – dafür zusätzlich:
#   DEPLOY_TOKEN – muss mit APP_DEPLOY_TOKEN auf dem Server übereinstimmen
#                  (siehe AppUpdateController, application.yml)
# Fehlt DEPLOY_TOKEN, wird dieser Schritt einfach übersprungen.

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: App-Version auslesen
        id: version
        run: echo "version=$(node -e "console.log(require('./app.json').expo.version)")" >> "$GITHUB_OUTPUT"

      - name: VersionCode setzen
        # Play Store verlangt einen bei jedem Upload strikt steigenden versionCode;
        # github.run_number steigt garantiert bei jedem Workflow-Lauf.
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('./app.json', 'utf8'));
            config.expo.android = config.expo.android || {};
            config.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync('./app.json', JSON.stringify(config, null, 2) + '\n');
          "

      - name: Natives Android-Projekt generieren
        run: npx expo prebuild --platform android --clean --no-install

      - name: Release-Keystore entschlüsseln
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "MYAPP_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 nicht gesetzt – Release-APK wird nur mit dem Debug-Key signiert (kein GitHub Release, nur Artifact)."
          fi

      - name: Signierte Release-APK bauen
        working-directory: mobile-app/android
        env:
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: schwalmtalzupfer-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: GitHub Release erstellen
        if: env.MYAPP_UPLOAD_STORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Schwalmtalzupfer App v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          prerelease: true
          files: mobile-app/android/app/build/outputs/apk/release/app-release.apk

      - name: Neue Version ans Backend melden (In-App-Update-Hinweis)
        if: env.MYAPP_UPLOAD_STORE_FILE != ''
        continue-on-error: true
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::notice::DEPLOY_TOKEN nicht gesetzt – Update-Hinweis ans Backend wird übersprungen."
            exit 0
          fi
          curl -sf -X POST "https://www.schwalmtalzupfer.de/api/app/android/publish" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -F "versionCode=${{ github.run_number }}" \
            -F "versionName=${{ steps.version.outputs.version }}" \
            -F "apk=@android/app/build/outputs/apk/release/app-release.apk;type=application/vnd.android.package-archive"
