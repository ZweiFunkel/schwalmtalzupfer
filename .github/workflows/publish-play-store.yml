name: App im Play Store veröffentlichen

# Manuell auslösbarer Workflow: baut ein signiertes Android App Bundle (.aab) und lädt es
# über die Google Play Developer API hoch. Läuft NIE automatisch (workflow_dispatch-only).
#
# Erst nutzbar, sobald:
#   1. ein Google Play Console Konto existiert (Konto-Erstellung + einmalige 25$-Gebühr –
#      das muss von Hand passieren, siehe Chat-Verlauf)
#   2. die App einmal manuell in der Play Console angelegt und ein erstes .aab von Hand
#      hochgeladen wurde (die Play Developer API kann keine komplett neue App anlegen,
#      nur bestehende Einträge aktualisieren)
#   3. in der Play Console ein Service-Account mit Release-Manager-Rechten für diese App
#      angelegt und dessen JSON-Key als Repo-Secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#      hinterlegt ist
#
# Nutzt denselben Release-Keystore wie build-android.yml (ANDROID_KEYSTORE_BASE64 etc.).

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play-Track'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      versionCode:
        description: 'Android versionCode (muss höher sein als der zuletzt hochgeladene)'
        required: true
        type: number

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: VersionCode setzen
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('./app.json', 'utf8'));
            config.expo.android = config.expo.android || {};
            config.expo.android.versionCode = ${{ inputs.versionCode }};
            fs.writeFileSync('./app.json', JSON.stringify(config, null, 2) + '\n');
          "

      - name: Natives Android-Projekt generieren
        run: npx expo prebuild --platform android --clean --no-install

      - name: Release-Keystore entschlüsseln
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 fehlt – ohne Release-Keystore kein Play-Store-Upload möglich."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "MYAPP_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Signiertes App Bundle bauen
        working-directory: mobile-app/android
        env:
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Google-Play-Service-Account-Key schreiben
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON fehlt (siehe Kommentar oben im Workflow)."
            exit 1
          fi
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Auf Google Play hochladen
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: de.schwalmtalzupfer.app
          releaseFiles: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
