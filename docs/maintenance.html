<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Kurz Wartung – Schwalmtalzupfer</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #020617;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(34, 197, 94, 0.25);
    border-top-color: #22c55e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.5rem; margin: 0 0 8px; color: #fff; }
  p { color: #94a3b8; max-width: 32rem; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1>Kurze Wartungspause</h1>
    <p>Wir spielen gerade ein Update ein – in wenigen Sekunden ist die Seite wieder da. Diese Seite lädt sich automatisch neu.</p>
  </div>
</body>
</html>
